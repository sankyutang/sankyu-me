name = "sankyume-admin"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "sankyume_admin"
database_id = "5d4765cd-fb35-4f66-9c21-2c25adc89769"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SITE_BUCKET"
bucket_name = "sankyume-site"

[vars]
SITE_BASE_URL = "https://sankyu.me"
ASSET_BASE_URL = "https://sankyu.me/assets"
# Set via `wrangler pages secret put` in CI/prod:
#   CLOUDFLARE_API_TOKEN  (zone cache purge scope)
#   CLOUDFLARE_ZONE_ID
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT  (only needed if not using R2 binding for puts)
