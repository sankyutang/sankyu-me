<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>首页视觉提案 A / B — sankyu.me（仅预览）</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fafaf8;
      --ink: #1a1a1a;
      --muted: #666;
      --line: #e6e4e0;
      --accent: #c41e1e;
      --font: "Noto Sans SC", "Source Sans 3", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      line-height: 1.7;
      padding: 2.5rem 1.25rem 3rem;
    }
    .box {
      width: min(36rem, 100%);
      margin: 0 auto;
    }
    .note {
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: "Source Sans 3", sans-serif;
      margin: 0 0 0.75rem;
    }
    h1 {
      margin: 0;
      font-size: 1.75rem;
      letter-spacing: 0.04em;
      line-height: 1.25;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 1rem 0 0;
    }
    .warn {
      margin-top: 1.25rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 0.875rem;
      color: var(--ink);
    }
    .warn strong { color: var(--accent); }
    ul {
      list-style: none;
      margin: 2rem 0 0;
      padding: 0;
      display: grid;
      gap: 0.85rem;
    }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #fff;
      border: 1px solid var(--line);
      padding: 1.15rem 1.25rem;
      transition: border-color 0.15s;
    }
    a.card:hover { border-color: var(--ink); }
    a.card h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }
    a.card span {
      display: block;
      margin-top: 0.4rem;
      font-size: 0.875rem;
      color: var(--muted);
    }
    .label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--accent);
      font-family: "Source Sans 3", sans-serif;
      margin-bottom: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <p class="note">Design proposals · not live</p>
    <h1>sankyu.me 首页视觉提案</h1>
    <p>同一方向（阅读优先 + 克制业务入口），两种可比较的布局。双击 HTML 即可本地预览，无需构建。</p>
    <div class="warn"><strong>未上线。</strong> 本目录仅供审阅，不改生产页面、数据或发布链路；请勿当作可合并上线的功能 PR。</div>
    <ul>
      <li>
        <a class="card" href="./version-a-quiet-reading.html">
          <div class="label">VERSION A</div>
          <h2>安静单栏阅读</h2>
          <span>窄栏居中、文章节奏主导；合作入口置于文末克制出现。</span>
        </a>
      </li>
      <li>
        <a class="card" href="./version-b-editorial.html">
          <div class="label">VERSION B</div>
          <h2>编辑式双栏</h2>
          <span>报头式 masthead；桌面左侧文章、右侧轻量合作侧栏；可按标签筛选。</span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
